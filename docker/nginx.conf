server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Revalidate files after rebuilding, including unchanged Unity filenames.
    expires -1;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm application/octet-stream text/css;

    location = /editor {
        return 302 /editor/;
    }

    location ^~ /editor/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $editor_upstream http://database-editor:3000;
        proxy_pass $editor_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        client_max_body_size 1m;
        expires off;
    }

    # Local Compose exposes only this JSON from the read-only authoring directory.
    # Do not fall back to an older packaged database when the live file is missing.
    location = /StreamingAssets/FootballWorld/database.json {
        alias /opt/football-database/four-clubs.database.json;
        types { }
        default_type application/json;
        expires off;
        etag off;
        if_modified_since off;
        open_file_cache off;
        add_header Cache-Control "no-store" always;
    }

    # Unity Gzip builds need the original MIME type and Content-Encoding.
    location ~ \.wasm\.gz$ {
        gzip off;
        types { }
        default_type application/wasm;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    location ~ \.js\.gz$ {
        gzip off;
        types { }
        default_type application/javascript;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    location ~ \.json\.gz$ {
        gzip off;
        types { }
        default_type application/json;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    location ~ \.gz$ {
        gzip off;
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Revalidate files after rebuilding, including unchanged Unity filenames.
    expires -1;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm application/octet-stream text/css;

    # Unity Gzip builds need the original MIME type and Content-Encoding.
    location ~ \.wasm\.gz$ {
        gzip off;
        types { }
        default_type application/wasm;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    location ~ \.js\.gz$ {
        gzip off;
        types { }
        default_type application/javascript;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    location ~ \.json\.gz$ {
        gzip off;
        types { }
        default_type application/json;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    location ~ \.gz$ {
        gzip off;
        types { }
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        try_files $uri =404;
    }

    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
